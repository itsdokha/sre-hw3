apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-app
  labels:
    app: tasks-app
    app.kubernetes.io/part-of: tasks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tasks-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tasks-app
        app.kubernetes.io/part-of: tasks
    spec:
      containers:
        - name: app
          image: tasks-app:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tasks-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: SERVICE_VERSION
              value: "1.1"
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tasks-app
  labels:
    app: tasks-app
    app.kubernetes.io/part-of: tasks
spec:
  type: NodePort
  selector:
    app: tasks-app
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
